# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    estun_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      #type: joint_state_broadcaster/JointStateBroadcaster

estun_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
      
    # 添加话题重映射
    topics:
      joint_trajectory: /RobotMove  # 将轨迹命令重映射到您的控制器话题
    # 或者使用 action 重映射（如果适用）
    action_name: follow_joint_trajectory
    
joint_state_broadcaster:
  ros__parameters:
    # 将关节状态发布重映射到您的关节状态话题
    topics:
      joint_states: /joint_states
